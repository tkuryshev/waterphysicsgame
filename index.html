<div id="sub-dam" class="subpanel glass">
  <div class="grp" id="dam-kinds"><button class="pb on" data-k="concrete">Бетонная</button><button class="pb" data-k="arch">Арочная</button><button class="pb" data-k="earth">Земляная</button></div>
  <div class="sl"><label>Изгиб <span id="l-curve">0%</span></label><input type="range" id="s-curve" min="-45" max="45" step="5" value="0"></div>
  <div class="sl"><label>Высота <span id="l-damh">8.0 м</span></label><input type="range" id="s-damh" min="4" max="16" step="0.5" value="8"></div>
  <div class="tip"><b>Тяни ЛКМ</b> от берега до берега · <b>ПКМ</b> — отмена · <b>Q/E</b> изгиб · клик — готовая секция</div>
</div>
<div id="sub-sluice" class="subpanel glass">
  <div class="grp" id="sluice-kinds"><button class="pb on" data-k="sluice">Шлюз с затворами</button><button class="pb" data-k="spillway">Ступенчатый водослив</button></div>
  <div class="tip"><b>Наведи на дамбу</b> — встроится внутрь. Открытый шлюз сбрасывает водохранилище за секунды</div>
</div>
<div id="sub-turbine" class="subpanel glass">
  <div class="grp" id="turbine-kinds"><button class="pb on" data-k="turbine">ГЭС · 1 агрегат</button><button class="pb" data-k="turbine2">ГЭС · 2 агрегата</button></div>
  <div class="tip"><b>Наведи на дамбу</b>. Мощность растёт с напором и расходом воды</div>
</div>
<div id="sub-wall" class="subpanel glass">
  <div class="sl"><label>Высота <span id="l-wallh">3.5 м</span></label><input type="range" id="s-wallh" min="2" max="8" step="0.5" value="3.5"></div>
  <div class="sl"><label>Изгиб <span id="l-wcurve">0%</span></label><input type="range" id="s-wcurve" min="-40" max="40" step="5" value="0"></div>
  <div class="tip"><b>Тяни ЛКМ</b> вдоль берега — защитит низины от паводка</div>
</div>
<div id="sub-canal" class="subpanel glass">
  <div class="sl gold"><label>Ширина <span id="l-cw">8 м</span></label><input type="range" id="s-cw" min="4" max="20" step="1" value="8"></div>
  <div class="sl gold"><label>Глубина <span id="l-cd">3.5 м</span></label><input type="range" id="s-cd" min="1.5" max="8" step="0.5" value="3.5"></div>
  <div class="tip"><b>Тяни ЛКМ от А к Б</b> — прорежет канал с уклоном. Объединяй реки и отводи воду</div>
</div>
<div id="sub-terrain" class="subpanel glass">
  <div class="grp" id="brush-modes"><button class="pb gold on" data-m="raise">Поднять</button><button class="pb gold" data-m="lower">Опустить</button><button class="pb gold" data-m="flatten">Плато</button><button class="pb gold" data-m="berm">Вал</button><button class="pb gold" data-m="smooth">Сгладить</button></div>
  <div class="sl gold"><label>Радиус <span id="l-rad">9 м</span></label><input type="range" id="s-rad" min="3" max="28" step="0.5" value="9"></div>
  <div class="sl gold"><label>Сила <span id="l-str">70%</span></label><input type="range" id="s-str" min="10" max="150" step="5" value="70"></div>
  <div class="grp"><button class="ib" id="b-undo" title="Отменить (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a5 5 0 0 1 5 5"/></svg></button><button class="ib" id="b-redo" title="Повторить (Ctrl+Y)" disabled><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H10a5 5 0 0 0-5 5"/></svg></button></div>
  <div class="tip"><b>ЛКМ</b> лепить · <b>Shift</b> реверс · <b>[ ]</b> радиус</div>
</div>
<div id="sub-energy" class="subpanel glass">

  <div class="tip" id="e-tip"></div>
</div>

  <button class="pb danger" id="c-del">Снести</button>
</div>
